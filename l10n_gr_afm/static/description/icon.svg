<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background: Greek blue -->
  <rect width="128" height="128" rx="12" fill="#0D5EAF"/>

  <!-- Subtle lighter accent bar at top -->
  <rect y="0" width="128" height="32" rx="12" fill="#1A6FC4"/>
  <rect y="12" width="128" height="20" fill="#1A6FC4"/>

  <!-- Search/lookup magnifying glass (centered) -->
  <circle cx="58" cy="56" r="20" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="72" y1="70" x2="86" y2="84" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Document lines inside magnifying glass -->
  <line x1="48" y1="50" x2="68" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="56" x2="64" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="62" x2="62" y2="62" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- "AFM" text -->
  <text x="64" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" letter-spacing="2">ΑΦΜ</text>
</svg>
